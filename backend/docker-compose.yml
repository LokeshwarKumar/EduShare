services:
  mysql:
    image: mysql:8.0
    container_name: edumat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: loki-2526
      MYSQL_DATABASE: edumat_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - edumat-network
    restart: unless-stopped

  backend:
    image: edumat-backend
    container_name: edumat-backend
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/edumat_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: loki-2526
      SERVER_PORT: 8081
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      APP_FILE_UPLOAD_DIR: /app/uploads
      APP_FILE_BASE_URL: http://localhost:8081
      APP_JWT_SECRET: mySecretKey123456789012345678901234567890
      APP_JWT_EXPIRATION_MS: 86400000
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8081:8081"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - edumat-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  edumat-network:
    driver: bridge
